name: Android CI

on:
  push:
    branches: [ main, steven-prestamolab ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar proyecto (Debug)
        run: ./gradlew assembleDebug

      - name: Ejecutar pruebas unitarias
        run: ./gradlew testDebugUnitTest

      - name: Ejecutar Android Lint
        run: ./gradlew lintDebug

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Publicar reporte de Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Publicar APK generado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
